      --card-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1E9D8;
    --ink-soft:#C4B8A2;
    --paper:#221A12;
    --paper-2:#2C2216;
    --paper-3:#3A2E1C;
    --line: rgba(241,233,216,0.16);
    --teal:#7FB8BC;
    --teal-ink:#DCEFEF;
    --teal-soft:#1E3538;
    --marigold:#F0B056;
    --marigold-soft:#3B2E16;
    --rose:#E29498;
    --rose-soft:#3A2224;
    --sage:#9BC09D;
    --sage-soft:#243422;
    --card-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Fraunces',Georgia,serif;}

  a{color:inherit;}
  button{font-family:inherit;}

  .shell{
    max-width:560px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header ---------- */
  header.top{
    position:sticky;
    top:0;
    padding-top:env(safe-area-inset-top,0px);
    background:var(--paper);
    z-index:20;
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    padding:18px 20px 14px;
  }
  .top-row1{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .top-controls{
    display:flex;
    align-items:center;
    gap:6px;
    flex:none;
  }
  .lang-select{
    width:auto;
    padding:6px 8px;
    font-size:0.72rem;
    font-weight:700;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink);
  }
  .theme-btn{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:8px;
    width:32px;height:32px;
    font-size:0.95rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    flex:none;
  }
  .wordmark{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:4px 8px;
    flex:1;
    min-width:0;
  }
  .wordmark .mark{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:-0.01em;
  }
  .wordmark .tag{
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .mode-toggle{
    margin-top:14px;
    display:flex;
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:3px;
  }
  .mode-toggle button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:0.82rem;
    font-weight:700;
    padding:9px 10px;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .mode-toggle button.active{
    background:var(--teal);
    color:var(--paper);
  }

  .tabs{
    display:flex;
    gap:4px;
    padding:0 20px;
  }
  .tabs button{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-weight:700;
    font-size:0.86rem;
    padding:10px 4px 12px;
    margin-right:18px;
    cursor:pointer;
    border-bottom:2.5px solid transparent;
  }
  .tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--marigold);
  }

  main{
    flex:1;
    padding:18px 20px calc(92px + env(safe-area-inset-bottom,0px));
  }

  h2.section-title{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:1.28rem;
    margin:4px 0 4px;
  }
  p.section-sub{
    color:var(--ink-soft);
    font-size:0.9rem;
    margin:0 0 18px;
    line-height:1.5;
  }

  label{
    display:block;
    font-size:0.78rem;
    font-weight:700;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  select, input[type="date"], input[type="time"], input[type="number"], input[type="text"], textarea{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink);
    font-family:inherit;
    font-size:0.92rem;
  }
  textarea{resize:vertical; min-height:70px;}
  select:focus, input:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{background:var(--teal); color:var(--paper);}
  .btn-marigold{background:var(--marigold); color:#241804;}
  .btn-ghost{background:transparent; color:var(--teal); border:1px solid var(--line);}
  .btn-small{width:auto; padding:8px 14px; font-size:0.82rem; border-radius:8px;}
  .btn-danger-ghost{background:transparent; color:var(--rose); border:1px solid var(--line); width:auto; padding:8px 14px; font-size:0.82rem; border-radius:8px;}

  /* ---------- Companion list ---------- */
  .companion-card{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:14px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--paper-2);
    margin-bottom:10px;
    cursor:pointer;
    text-align:left;
    width:100%;
  }
  .avatar{
    flex:none;
    width:46px;height:46px;
    border-radius:50%;
    display:block;
    object-fit:cover;
    background:var(--paper-3);
    border:1px solid var(--line);
  }
  .companion-card .info{flex:1; min-width:0;}
  .companion-card .row1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .companion-card .name{font-weight:700; font-size:0.96rem;}
  .companion-card .rate{font-weight:800; color:var(--teal); font-size:0.9rem; white-space:nowrap;}
  .companion-card .meta{font-size:0.78rem; color:var(--ink-soft); margin-top:2px;}
  .companion-card .bio{font-size:0.83rem; color:var(--ink-soft); margin-top:6px; line-height:1.45;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:0.72rem;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
  }
  .badge-verified{background:var(--sage-soft); color:var(--sage);}
  .badge-pending{background:var(--marigold-soft); color:var(--marigold);}
  .badge-upcoming{background:var(--teal-soft); color:var(--teal);}
  .badge-active{background:var(--teal-soft); color:var(--teal);}
  .badge-declined{background:var(--rose-soft); color:var(--rose);}
  .badge-completed{background:var(--paper-3); color:var(--ink-soft);}

  .pulse-dot{
    width:6px;height:6px;border-radius:50%;background:var(--teal);
    display:inline-block; animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}

  /* ---------- Ticket-style booking card ---------- */
  .ticket{
    position:relative;
    display:flex;
    border:1px solid var(--line);
    border-radius:16px;
    background:var(--paper-2);
    margin-bottom:16px;
    overflow:hidden;
  }
  .ticket .main{flex:1; padding:14px 12px 14px 16px; min-width:0;}
  .ticket .stub{
    flex:none;
    width:96px;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-left:1.5px dashed var(--line);
    position:relative;
  }
  .ticket .stub::before, .ticket .stub::after{
    content:"";
    position:absolute;
    left:-8px;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--paper);
  }
  .ticket .stub::before{top:-8px;}
  .ticket .stub::after{bottom:-8px;}
  .ticket .stub .price{font-weight:800; font-size:0.98rem; color:var(--teal);}
  .ticket .stub .price-label{font-size:0.66rem; color:var(--ink-soft); margin-top:2px;}

  .ticket .elder-name{font-weight:700; font-size:0.95rem;}
  .ticket .with{font-size:0.8rem; color:var(--ink-soft); margin-top:2px;}
  .ticket .when{font-size:0.8rem; margin-top:6px; display:flex; align-items:center; gap:6px;}
  .ticket .statusrow{margin-top:8px; display:flex; align-items:center; gap:8px;}

  .timeline{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .timeline-item{display:flex; gap:10px; margin-bottom:10px;}
  .timeline-dot{
    flex:none; width:28px;height:28px; border-radius:8px;
    background:var(--teal-soft); color:var(--teal);
    display:flex; align-items:center; justify-content:center; font-size:0.8rem;
  }
  .timeline-item .t-time{font-size:0.72rem; color:var(--ink-soft); font-weight:700;}
  .timeline-item .t-note{font-size:0.85rem; margin-top:1px; line-height:1.4;}

  .card-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}

  .stars{display:flex; gap:4px; margin:8px 0;}
  .stars button{background:none; border:none; font-size:1.35rem; cursor:pointer; padding:0; line-height:1; color:var(--paper-3);}
  .stars button.filled{color:var(--marigold);}

  .empty{
    text-align:center;
    padding:48px 16px;
    color:var(--ink-soft);
  }
  .empty .emoji{font-size:2.2rem; display:block; margin-bottom:10px;}
  .empty .btn{width:auto; display:inline-flex; margin-top:14px;}

  .elder-card{
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--paper-2);
    padding:14px;
    margin-bottom:10px;
  }
  .elder-card .row1{display:flex; justify-content:space-between; align-items:baseline;}
  .elder-card .name{font-weight:700;}
  .elder-card .meta{font-size:0.78rem; color:var(--ink-soft); margin-top:2px;}
  .elder-card .notes{font-size:0.85rem; margin-top:8px; line-height:1.5; color:var(--ink);}

  /* ---------- Modal ---------- */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(20,15,8,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
    padding-top:env(safe-area-inset-top,0px);
  }
  .backdrop.show{display:flex;}
  .modal{
    background:var(--paper);
    width:100%;
    max-width:560px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line);
    border-bottom:none;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .modal-head h3{font-family:'Fraunces',Georgia,serif; font-size:1.2rem; font-weight:600; margin:0;}
  .modal-close{background:none; border:none; font-size:1.3rem; color:var(--ink-soft); cursor:pointer; line-height:1; padding:2px 6px;}

  .price-line{display:flex; justify-content:space-between; font-size:0.88rem; padding:6px 0;}
  .price-line.total{font-weight:800; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; font-size:0.98rem;}

  .toast{
    position:fixed;
    bottom:calc(84px + env(safe-area-inset-bottom,0px));
    left:50%;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--paper);
    padding:11px 18px;
    border-radius:10px;
    font-size:0.85rem;
    font-weight:600;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    max-width:88%;
    text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .companion-note{
    background:var(--marigold-soft);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.82rem;
    line-height:1.5;
    margin-top:10px;
  }

  .verify-panel{
    background:var(--sage-soft);
    border-radius:12px;
    padding:12px 14px;
    margin-top:14px;
  }
  .verify-head{font-weight:700; font-size:0.85rem; margin-bottom:6px;}
  .verify-row{display:flex; justify-content:space-between; font-size:0.82rem; padding:3px 0;}
  .v-ok{color:var(--sage); font-weight:700;}
  .verify-note{font-size:0.73rem; color:var(--ink-soft); margin-top:8px; line-height:1.5;}

  .doc-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
    font-size:0.85rem; background:var(--paper-2);
  }
  .doc-row .doc-status{font-size:0.76rem; font-weight:700;}
  .doc-status.v-pending{color:var(--marigold);}
  .doc-status.v-ok{color:var(--sage);}

  .field-row{display:flex; gap:10px;}
  .field-row > div{flex:1;}

  /* ---------- Install banner ---------- */
  .install-banner{
    position:fixed;
    left:0; right:0; bottom:0;
    margin:0 auto;
    max-width:560px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--teal-ink, var(--ink));
    color:var(--paper);
    display:flex;
    align-items:center;
    gap:12px;
    z-index:30;
    border-top:1px solid var(--line);
  }
  .install-banner .icon-badge{
    flex:none;
    width:34px;height:34px;
    border-radius:9px;
    background:var(--marigold);
    color:#241804;
    font-weight:800;
    font-size:0.78rem;
    display:flex;align-items:center;justify-content:center;
  }
  .install-banner .copy{flex:1; min-width:0;}
  .install-banner .copy .h{font-weight:700; font-size:0.85rem;}
  .install-banner .copy .s{font-size:0.76rem; opacity:0.82; margin-top:1px; line-height:1.4;}
  .install-banner .actions{flex:none; display:flex; align-items:center; gap:6px;}
  .install-banner button.install-cta{
    background:var(--marigold);
    color:#241804;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-weight:700;
    font-size:0.78rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .install-banner button.install-dismiss{
    background:none;
    border:none;
    color:var(--paper);
    opacity:0.7;
    font-size:1.1rem;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
</style>
</head>

function t(key){
  const lang = (typeof state!=='undefined' && state.lang) || 'en';
  return (TR[lang] && TR[lang][key]) || TR.en[key] || key;
}
function setLang(lang){
  state.lang = lang;
  saveState();
  applyHeaderTexts();
  render();
}
function applyHeaderTexts(){
  document.getElementById('tagLine').textContent = t('tagline');
  document.getElementById('modeFamily').textContent = t('modeFamily');
  document.getElementById('modeCompanion').textContent = t('modeCompanion');
  document.querySelector('[data-tab="book"]').textContent = t('tabBook');
  document.querySelector('[data-tab="bookings"]').textContent = t('tabBookings');
  document.querySelector('[data-tab="elders"]').textContent = t('tabElders');
  document.getElementById('langSelect').value = state.lang || 'en';
}

/* ============ Theme ============ */
function applyTheme(){
  const root = document.documentElement;
  if(state.theme === 'light'){ root.setAttribute('data-theme','light'); }
  else if(state.theme === 'dark'){ root.setAttribute('data-theme','dark'); }
  else { root.removeAttribute('data-theme'); }
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = state.theme === 'dark' || (state.theme === 'auto' && systemDark);
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = isDark ? '🌙' : '☀️';
}
function toggleTheme(){
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const currentlyDark = state.theme === 'dark' || (state.theme === 'auto' && systemDark);
  state.theme = currentlyDark ? 'light' : 'dark';
  saveState();
  applyTheme();
}

function pad(n){return String(n).padStart(2,'0');}
function isoDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function isoTime(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-IN',{weekday:'short', day:'numeric', month:'short'});
}
function fmtWhen(dt){
  return dt.toLocaleString('en-IN',{day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}
function money(n){return '\u20B9' + Math.round(n).toLocaleString('en-IN');}
function initials(name){return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed.elders || !parsed.bookings) return defaultState();
    // Migration: fill in fields added in later versions for people with older saved state.
    const d = defaultState();
    if(!parsed.companionDocs) parsed.companionDocs = d.companionDocs;
    if(!parsed.theme) parsed.theme = 'auto';
    if(!parsed.lang) parsed.lang = 'en';
    return parsed;
  }catch(e){
    return defaultState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage unavailable, continue in-memory */ }
}

let state = loadState();
let bookingDraft = null; // {elderId, date, startTime, hours}

/* ============ Toast ============ */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ============ Modal ============ */
function openModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('backdrop').classList.add('show');
}
function closeModal(){
  document.getElementById('backdrop').classList.remove('show');
}

/* ============ Mode & tabs ============ */
function setMode(m){
  state.mode = m;
  document.getElementById('modeFamily').classList.toggle('active', m==='family');
  document.getElementById('modeCompanion').classList.toggle('active', m==='companion');
  document.getElementById('familyTabs').style.display = (m==='family') ? 'flex' : 'none';
  render();
}
function setTab(t){
  state.tab = t;
  document.querySelectorAll('#familyTabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}

/* ============ Render root ============ */
function render(){
  const main = document.getElementById('main');
  if(state.mode==='companion'){
    main.innerHTML = renderCompanionView();
  } else if(state.tab==='book'){
    main.innerHTML = renderBookTab();
  } else if(state.tab==='bookings'){
    main.innerHTML = renderBookingsTab();
  } else {
    main.innerHTML = renderEldersTab();
  }
}

function onDurationChange(){
  const v = document.getElementById('fDuration').value;
  document.getElementById('customDaysWrap').style.display = (v==='custom') ? 'block' : 'none';
}

function computeHours(){
  const v = document.getElementById('fDuration').value;
  if(v==='custom'){
    const days = Math.max(3, parseInt(document.getElementById('fDays').value||'3',10));
    return days*8;
  }
  return parseInt(v,10);
}

    <div style="font-size:0.88rem; color:var(--ink-soft); line-height:1.6;">
      ${fmtDate(bookingDraft.date)} at ${bookingDraft.startTime} · ${bookingDraft.hours} hour${bookingDraft.hours===1?'':'s'}
    </div>

    <div style="margin-top:14px;">
      <div class="price-line"><span>Companion charge (${bookingDraft.hours} hrs × ${money(c.rate)})</span><span>${money(companionCharge)}</span></div>
      <div class="price-line"><span>ExtraHands verification &amp; support fee (20%)</span><span>${money(fee)}</span></div>
      <div class="price-line total"><span>Total</span><span>${money(total)}</span></div>
    </div>

    <button class="btn btn-marigold" style="margin-top:18px;" onclick="confirmBooking('${c.id}')">Pay ${money(total)} &amp; send request</button>
    <p style="font-size:0.76rem; color:var(--ink-soft); text-align:center; margin-top:8px;">${c.name.split(' ')[0]} will need to accept before the visit is confirmed.</p>
  `);
}

function confirmBooking(companionId){
  const c = COMPANIONS.find(x=>x.id===companionId);
  const id = 'b' + Math.random().toString(36).slice(2,9);
  state.bookings.unshift({
    id, elderId: bookingDraft.elderId, companionId,
    date: bookingDraft.date, startTime: bookingDraft.startTime, hours: bookingDraft.hours,
    status:'pending', checkins:[], rating:null, review:null, createdAt: new Date().toISOString()
  });
  saveState();
  closeModal();
  showToast(`Request sent to ${c.name.split(' ')[0]} — waiting for confirmation`);
  setTab('bookings');
}

/* ============ Bookings tab (family) ============ */
function statusBadge(status){
  if(status==='pending') return `<span class="badge badge-pending">${t('statusRequested')}</span>`;
  if(status==='upcoming') return `<span class="badge badge-upcoming">${t('statusConfirmed')}</span>`;
  if(status==='active') return `<span class="badge badge-active"><span class="pulse-dot"></span>&nbsp;${t('statusInProgress')}</span>`;
  if(status==='declined') return `<span class="badge badge-declined">${t('statusDeclined')}</span>`;
  return `<span class="badge badge-completed">${t('statusCompleted')}</span>`;
}

function renderBookingsTab(){
  if(state.bookings.length===0){
    return `
      <div class="empty">
        <span class="emoji">🗓️</span>
        <div><strong>${t('bookingsEmptyTitle')}</strong></div>
        <div style="font-size:0.88rem; margin-top:4px;">${t('bookingsEmptySub')}</div>
        <button class="btn btn-primary" onclick="setTab('book')">${t('bookBtn')}</button>
      </div>`;
  }

  const sorted = [...state.bookings].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  const cards = sorted.map(b => renderBookingCard(b)).join('');

  return `
    <h2 class="section-title">${t('bookingsTitle')}</h2>
    <p class="section-sub">${t('bookingsSub')}</p>
    ${cards}
  `;
}

function renderBookingCard(b){
  const elder = state.elders.find(e=>e.id===b.elderId) || {name:'Unknown elder'};
  const c = COMPANIONS.find(x=>x.id===b.companionId);
  const companionCharge = c.rate * b.hours;
  const total = Math.round(companionCharge*1.2);

  let timeline = '';
  if(b.checkins.length){
    timeline = `<div class="timeline">` + b.checkins.map(ci=>{
      const icon = ci.type==='check-in' ? '📍' : ci.type==='check-out' ? '🏁' : '📝';
      const label = ci.type==='check-in' ? 'Checked in' : ci.type==='check-out' ? 'Checked out' : 'Update';
      return `
        <div class="timeline-item">
          <div class="timeline-dot">${icon}</div>
          <div>
            <div class="t-time">${label} · ${fmtWhen(new Date(ci.time))}</div>
            <div class="t-note">${ci.note}</div>
          </div>
        </div>`;
    }).join('') + `</div>`;
  }

  let ratingBlock = '';
  if(b.status==='completed'){
    if(b.rating){
      ratingBlock = `<div style="margin-top:10px; font-size:0.85rem;">Your rating: ${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)} ${b.review ? '· "'+b.review+'"' : ''}</div>`;
    } else {
      ratingBlock = `
        <div class="card-actions">
          <button class="btn btn-ghost btn-small" onclick="openRating('${b.id}')">Rate this visit</button>
        </div>`;
    }
  }

  let statusNote = '';
  if(b.status==='pending'){
    statusNote = `<div class="companion-note" style="margin-top:10px;">Waiting for ${c.name.split(' ')[0]} to accept — typically responds ${c.responseTime}. You won't be charged until it's confirmed.</div>`;
  } else if(b.status==='declined'){
    statusNote = `
      <div class="companion-note" style="margin-top:10px; background:var(--rose-soft);">${c.name.split(' ')[0]} wasn't able to accept this request. Nothing was charged.</div>
      <div class="card-actions"><button class="btn btn-ghost btn-small" onclick="setTab('book')">Find another companion</button></div>`;
  }

  return `
    <div class="ticket">
      <div class="main">
        <div class="elder-name">${elder.name}</div>
        <div class="with">with ${c.name} · ${money(c.rate)}/hr</div>
        <div class="when">📅 ${fmtDate(b.date)}, ${b.startTime} · ${b.hours} hr${b.hours===1?'':'s'}</div>
        <div class="statusrow">${statusBadge(b.status)}</div>
        ${statusNote}
        ${timeline}
        ${ratingBlock}
      </div>
      <div class="stub">
        <div class="price">${money(total)}</div>
        <div class="price-label">${b.status==='pending' ? 'if confirmed' : 'total paid'}</div>
      </div>
    </div>
  `;
}

function openRating(bookingId){
  openModal(`
    <div class="modal-head">
      <h3>Rate this visit</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <p class="section-sub" style="margin-top:6px;">Your rating helps other families choose with confidence.</p>
    <div class="stars" id="starRow">
      ${[1,2,3,4,5].map(n=>`<button data-n="${n}" onclick="setStar(${n})">★</button>`).join('')}
    </div>
    <label for="reviewText">A note about the visit (optional)</label>
    <textarea id="reviewText" placeholder="e.g. Very patient and punctual, my parents felt at ease."></textarea>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="submitRating('${bookingId}')">Submit rating</button>
  `);
  window._currentStar = 0;
}
function setStar(n){
  window._currentStar = n;
  document.querySelectorAll('#starRow button').forEach(btn=>{
    btn.classList.toggle('filled', parseInt(btn.dataset.n,10) <= n);
  });
}
function submitRating(bookingId){
  const n = window._currentStar || 0;
  if(n===0){ showToast('Tap a star to rate the visit'); return; }
  const b = state.bookings.find(x=>x.id===bookingId);
  b.rating = n;
  b.review = document.getElementById('reviewText').value.trim() || null;
  saveState();
  closeModal();
  showToast('Thanks for your feedback');
  render();
}

/* ============ Elder profiles tab ============ */
function renderEldersTab(){
  const cards = state.elders.map(e=>`
    <div class="elder-card">
      <div class="row1">
        <span class="name">${e.name}</span>
        <span class="meta">${e.age} yrs · ${e.relation}</span>
      </div>
      <div class="notes">${e.notes || 'No notes added yet.'}</div>
      <div class="card-actions">
        <button class="btn btn-ghost btn-small" onclick="openEditElder('${e.id}')">Edit</button>
        <button class="btn btn-danger-ghost" onclick="deleteElder('${e.id}')">Remove</button>
      </div>
    </div>
  `).join('');

  return `
    <h2 class="section-title">${t('eldersTitle')}</h2>
    <p class="section-sub">${t('eldersSub')}</p>
    ${cards}
    <button class="btn btn-ghost" style="margin-top:6px;" onclick="openEditElder(null)">${t('addElderBtn')}</button>
  `;
}

function openEditElder(elderId){
  const e = elderId ? state.elders.find(x=>x.id===elderId) : {name:'', age:'', relation:'', notes:''};
  openModal(`
    <div class="modal-head">
      <h3>${elderId ? 'Edit profile' : 'Add an elder'}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <label for="eName">Name</label>
    <input type="text" id="eName" value="${e.name}" placeholder="e.g. Siddhi Singh">
    <div class="field-row">
      <div>
        <label for="eAge">Age</label>
        <input type="number" id="eAge" value="${e.age}" min="1">
      </div>
      <div>
        <label for="eRelation">Relation</label>
        <input type="text" id="eRelation" value="${e.relation}" placeholder="e.g. Grandmother">
      </div>
    </div>
    <label for="eNotes">Notes for companions (mobility, medical, preferences)</label>
    <textarea id="eNotes" placeholder="e.g. Mild arthritis, prefers Hindi conversation, enjoys music.">${e.notes||''}</textarea>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="saveElder('${elderId||''}')">Save profile</button>
  `);
}

function saveElder(elderId){
  const name = document.getElementById('eName').value.trim();
  const age = parseInt(document.getElementById('eAge').value,10) || null;
  const relation = document.getElementById('eRelation').value.trim();
  const notes = document.getElementById('eNotes').value.trim();
  if(!name){ showToast('Please add a name'); return; }

  if(elderId){
    const e = state.elders.find(x=>x.id===elderId);
    Object.assign(e, {name, age, relation, notes});
  } else {
    state.elders.push({id:'e'+Math.random().toString(36).slice(2,9), name, age, relation, notes});
  }
  saveState();
  closeModal();
  showToast('Profile saved');
  render();
}

function deleteElder(elderId){
  const inUse = state.bookings.some(b=>b.elderId===elderId);
  if(inUse){
    showToast("Can't remove: this elder has bookings on record");
    return;
  }
  state.elders = state.elders.filter(x=>x.id!==elderId);
  saveState();
  render();
}

/* ============ Companion view ============ */
const DEMO_COMPANION_ID = 'c1'; // this prototype's companion view is a single demo account

function docStatusLine(label, doc, kind){
  const masked = kind==='aadhaar'
    ? (doc.last4 ? `•••• •••• ${doc.last4}` : '—')
    : (doc.last4 ? `${doc.last4}•••••` : '—');
  if(doc.status==='verified') return `<div class="verify-row"><span>${label}</span><span class="v-ok">✓ Verified · ${masked}</span></div>`;
  if(doc.status==='pending') return `<div class="verify-row"><span>${label}</span><span style="color:var(--marigold); font-weight:700;">⏳ Under review</span></div>`;
  return `<div class="verify-row"><span>${label}</span><span style="color:var(--ink-soft); font-weight:700;">Not submitted</span></div>`;
}

function renderCompanionView(){
  const me = COMPANIONS.find(x=>x.id===DEMO_COMPANION_ID);
  const docs = state.companionDocs;

  const docRow = (label, key, kind) => {
    const doc = docs[key];
    if(doc.status==='verified'){
      return `<div class="doc-row"><span>${label} <span class="doc-status v-ok">✓ Verified</span></span><button class="btn btn-ghost btn-small" onclick="resubmitDoc('${key}')">Re-upload</button></div>`;
    }
    if(doc.status==='pending'){
      return `<div class="doc-row"><span>${label} <span class="doc-status v-pending">⏳ Under review</span></span><button class="btn btn-ghost btn-small" onclick="simulateVerify('${key}')">Simulate ExtraHands review</button></div>`;
    }
    return `
      <div class="doc-row">
        <span>${label} <span class="doc-status" style="color:var(--ink-soft);">Not submitted</span></span>
        <label class="btn btn-marigold btn-small" style="cursor:pointer;">
          Upload
          <input type="file" accept="image/*,.pdf" style="display:none;" onchange="uploadDoc('${key}', this)">
        </label>
      </div>`;
  };

  const verificationSection = `
    <h2 class="section-title">${t('companionProfileTitle')}</h2>
    <p class="section-sub">You're viewing the demo companion account for ${me.name}. Families can see the verification status below (never the raw document) on your profile.</p>
    ${docRow('Aadhaar card', 'aadhaar', 'aadhaar')}
    ${docRow('PAN card', 'pan', 'pan')}
    <p style="font-size:0.76rem; color:var(--ink-soft); line-height:1.5; margin:6px 0 0;">In a live product, uploaded documents would be encrypted and reviewed by ExtraHands' verification team, never shown to families in raw form, only the verified status and masked reference number are.</p>
  `;

  const relevant = state.bookings.filter(b=>b.companionId===DEMO_COMPANION_ID && b.status!=='completed' && b.status!=='declined')
    .sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));

  if(relevant.length===0){
    return `
      ${verificationSection}
      <h2 class="section-title" style="margin-top:26px;">${t('todaysVisits')}</h2>
      <div class="empty">
        <span class="emoji">✅</span>
        <div><strong>No visits assigned right now.</strong></div>
        <div style="font-size:0.88rem; margin-top:4px;">Switch to "For families" and book ${me.name} to see a request appear here.</div>
      </div>`;
  }

  const cards = relevant.map(b=>{
    const elder = state.elders.find(e=>e.id===b.elderId);
    let actions = '';
    if(b.status==='pending'){
      actions = `
        <button class="btn btn-primary btn-small" onclick="acceptBooking('${b.id}')">Accept</button>
        <button class="btn btn-danger-ghost" onclick="declineBooking('${b.id}')">Decline</button>`;
    } else if(b.status==='upcoming'){
      actions = `<button class="btn btn-primary btn-small" onclick="openCheckIn('${b.id}')">Check in</button>`;
    } else {
      actions = `
        <button class="btn btn-ghost btn-small" onclick="openAddNote('${b.id}')">Add update</button>
        <button class="btn btn-marigold" style="width:auto;" onclick="openCheckOut('${b.id}')">Check out</button>`;
    }
    let timeline = '';
    if(b.checkins.length){
      timeline = `<div class="timeline">` + b.checkins.map(ci=>`
        <div class="timeline-item">
          <div class="timeline-dot">${ci.type==='check-in'?'📍':ci.type==='check-out'?'🏁':'📝'}</div>
          <div><div class="t-time">${fmtWhen(new Date(ci.time))}</div><div class="t-note">${ci.note}</div></div>
        </div>`).join('') + `</div>`;
    }
    return `
      <div class="ticket">
        <div class="main">
          <div class="elder-name">${elder.name} <span style="font-weight:500; color:var(--ink-soft); font-size:0.8rem;">(${elder.relation})</span></div>
          <div class="with">Booked by family</div>
          <div class="when">📅 ${fmtDate(b.date)}, ${b.startTime} · ${b.hours} hrs</div>
          <div class="statusrow">${statusBadge(b.status)}</div>
          <div class="companion-note"><strong>Notes:</strong> ${elder.notes}</div>
          ${timeline}
          <div class="card-actions">${actions}</div>
        </div>
      </div>`;
  }).join('');

  return `
    ${verificationSection}
    <h2 class="section-title" style="margin-top:26px;">${t('todaysVisits')}</h2>
    <p class="section-sub">Accepting or checking in here updates the family's app in real time.</p>
    ${cards}
  `;
}

function uploadDoc(key, input){
  if(!input.files || !input.files.length) return;
  state.companionDocs[key] = {status:'pending', last4: state.companionDocs[key].last4 || '----', verifiedOn: null};
  saveState();
  showToast('Uploaded — sent for ExtraHands review');
  render();
}
function resubmitDoc(key){
  state.companionDocs[key] = {...state.companionDocs[key], status:'pending'};
  saveState();
  showToast('Marked for re-verification');
  render();
}
function simulateVerify(key){
  const today = new Date().toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
  state.companionDocs[key] = {...state.companionDocs[key], status:'verified', verifiedOn: today};
  saveState();
  showToast('Verified by ExtraHands (simulated)');
  render();
}

function acceptBooking(bookingId){
  const b = state.bookings.find(x=>x.id===bookingId);
  b.status = 'upcoming';
  saveState();
  showToast('Accepted — the family now sees this as confirmed');
  render();
}
function declineBooking(bookingId){
  const b = state.bookings.find(x=>x.id===bookingId);
  b.status = 'declined';
  saveState();
  showToast('Request declined');
  render();
}

function openCheckIn(bookingId){
  openModal(`
    <div class="modal-head"><h3>Check in</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="section-sub" style="margin-top:6px;">This creates a timestamped, photo-style confirmation the family can see immediately.</p>
    <label for="ciNote">A quick note for the family</label>
    <textarea id="ciNote">Arrived safely, settling in now.</textarea>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="doCheckIn('${bookingId}')">Confirm check-in</button>
  `);
}
function doCheckIn(bookingId){
  const b = state.bookings.find(x=>x.id===bookingId);
  b.status = 'active';
  b.checkins.push({type:'check-in', time:new Date().toISOString(), note:document.getElementById('ciNote').value.trim() || 'Arrived.'});
  saveState();
  closeModal();
  showToast('Checked in — the family can see this now');
  render();
}

function openAddNote(bookingId){
  openModal(`
    <div class="modal-head"><h3>Add an update</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <label for="anNote">Note for the family</label>
    <textarea id="anNote" placeholder="e.g. Had lunch together, everything is fine."></textarea>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="doAddNote('${bookingId}')">Send update</button>
  `);
}
function doAddNote(bookingId){
  const note = document.getElementById('anNote').value.trim();
  if(!note){ showToast('Add a short note first'); return; }
  const b = state.bookings.find(x=>x.id===bookingId);
  b.checkins.push({type:'note', time:new Date().toISOString(), note});
  saveState();
  closeModal();
  showToast('Update sent to the family');
  render();
}

function openCheckOut(bookingId){
  openModal(`
    <div class="modal-head"><h3>Check out</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <label for="coNote">Closing note for the family</label>
    <textarea id="coNote">Calm, easy visit. No concerns. See you next time!</textarea>
    <button class="btn btn-marigold" style="margin-top:14px;" onclick="doCheckOut('${bookingId}')">Confirm check-out</button>
  `);
}
function doCheckOut(bookingId){
  const b = state.bookings.find(x=>x.id===bookingId);
  b.status = 'completed';
  b.checkins.push({type:'check-out', time:new Date().toISOString(), note:document.getElementById('coNote').value.trim() || 'Visit complete.'});
  saveState();
  closeModal();
  showToast('Checked out — visit marked complete');
  render();
}

/* ============ Install as app ============ */
const INSTALL_DISMISS_KEY = 'extrahands_install_dismissed';
let deferredInstallPrompt = null;

function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone === true;
}
function wasDismissed(){
  try{ return localStorage.getItem(INSTALL_DISMISS_KEY) === '1'; }catch(e){ return false; }
}
function dismissInstallBanner(){
  document.getElementById('installBanner').style.display = 'none';
  try{ localStorage.setItem(INSTALL_DISMISS_KEY, '1'); }catch(e){ /* ignore */ }
}
function handleInstallAction(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(()=>{
      deferredInstallPrompt = null;
      dismissInstallBanner();
    });
  } else {
    // No native prompt available (iOS Safari, or browser without support): show manual steps.
    showToast(isIOS() ? 'Tap Share, then "Add to Home Screen"' : 'Open your browser menu and choose "Add to Home screen"');
  }
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installActionBtn');
  if(btn) btn.textContent = 'Install';
  showInstallBannerIfNeeded();
});
window.addEventListener('appinstalled', () => {
  dismissInstallBanner();
});

function showInstallBannerIfNeeded(){
  if(isStandalone() || wasDismissed()) return;
  const banner = document.getElementById('installBanner');
  const copy = document.getElementById('installCopy');
  const btn = document.getElementById('installActionBtn');
  if(isIOS()){
    copy.textContent = 'Tap the Share icon, then "Add to Home Screen".';
    btn.textContent = 'How?';
  } else if(deferredInstallPrompt){
    copy.textContent = 'Use it like an app, full screen, one tap to open.';
    btn.textContent = 'Install';
  } else {
    copy.textContent = 'Open your browser menu and choose "Add to Home screen".';
    btn.textContent = 'How?';
  }
  banner.style.display = 'flex';
}

/* ============ Init ============ */
applyTheme();
applyHeaderTexts();
if(!isStandalone()){
  setTimeout(showInstallBannerIfNeeded, 900);
}
render();
</script>
